name: Financial Market Intelligence Pipeline

on:
  schedule:
    # Run once daily at 02:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      source_filter:
        description: 'Optional specific source name (e.g. MAS, Finextra)'
        required: false
        type: string
      tier_filter:
        description: 'Optional specific tier (1, 2, or 3)'
        required: false
        type: choice
        options:
          - ''
          - '1'
          - '2'
          - '3'
      dry_run:
        description: 'Run in dry-run mode without DB write'
        required: false
        type: boolean
        default: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Intelligence Ingestion Pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        run: |
          CMD="python src/main.py"
          if [ -n "${{ inputs.source_filter }}" ]; then
            CMD="$CMD --source '${{ inputs.source_filter }}'"
          fi
          if [ -n "${{ inputs.tier_filter }}" ]; then
            CMD="$CMD --tier ${{ inputs.tier_filter }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            CMD="$CMD --dry-run"
          fi
          echo "Executing: $CMD"
          PYTHONPATH=. eval $CMD
