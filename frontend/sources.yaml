# sources.yaml - Financial Market Intelligence Tracker Registry
sources:
  # --- Tier 1: Pure Regulatory & Central Bank Feeds (Ground Truth) ---
  - name: "FCA"
    tier: 1
    type: "rss"
    url: "https://www.fca.org.uk/news/rss.xml"
    institutions: ["FCA"]
    enabled: true

  - name: "Federal Reserve"
    tier: 1
    type: "rss"
    url: "https://www.federalreserve.gov/feeds/press_all.xml"
    institutions: ["Federal Reserve"]
    enabled: true

  - name: "OCC"
    tier: 1
    type: "rss"
    url: "https://www.occ.gov/rss/occ_news.xml"
    institutions: ["OCC"]
    enabled: true

  - name: "RBI"
    tier: 1
    type: "rss"
    url: "https://rbi.org.in/pressreleases_rss.xml"
    institutions: ["Reserve Bank of India", "RBI"]
    enabled: true

  - name: "MAS"
    tier: 1
    type: "newsapi"
    query: '"Monetary Authority of Singapore" AND (regulation OR circular OR penalty OR framework)'
    institutions: ["MAS"]
    daily_request_budget: 20
    enabled: true

  # --- Tier 2: Primary Mega-Banks, Payment Rails & Banking Trade Outlets ---
  # Primary Official Feeds
  - name: "JPMorgan Chase Official"
    tier: 2
    type: "rss"
    url: "https://www.jpmorganchase.com/newsroom/stories/rss.xml"
    institutions: ["JPMorgan Chase"]
    enabled: true

  - name: "Citi Official"
    tier: 2
    type: "rss"
    url: "https://www.citigroup.com/global/rss"
    institutions: ["Citigroup"]
    enabled: true

  - name: "HSBC Official"
    tier: 2
    type: "rss"
    url: "https://www.hsbc.com/rss-feed"
    institutions: ["HSBC"]
    enabled: true

  - name: "BNP Paribas Official"
    tier: 2
    type: "rss"
    url: "https://group.bnpparibas/en/rss/news/press-release"
    institutions: ["BNP Paribas"]
    enabled: true

  - name: "Nordea Official"
    tier: 2
    type: "rss"
    url: "https://www.nordea.com/en/rss.xml"
    institutions: ["Nordea"]
    enabled: true

  - name: "UOB Official"
    tier: 2
    type: "rss"
    url: "https://www.uobgroup.com/uobgroup/rss.xml"
    institutions: ["UOB"]
    enabled: true

  - name: "Amex Official"
    tier: 2
    type: "rss"
    url: "https://about.americanexpress.com/rss/news-releases.xml"
    institutions: ["American Express"]
    enabled: true

  - name: "BBVA Blog"
    tier: 2
    type: "rss"
    url: "https://www.bbva.com/en/feed/"
    institutions: ["BBVA"]
    enabled: true

  # Secondary Aggregators
  - name: "Finextra"
    tier: 2
    type: "rss"
    url: "https://www.finextra.com/rss/headlines.aspx"
    institutions: ["JPMorgan Chase", "Citigroup", "HSBC", "MUFG", "BBVA", "BNP Paribas", "Nordea", "SWIFT", "Visa", "Mastercard"]
    enabled: true

  - name: "Fintech News Singapore"
    tier: 2
    type: "rss"
    url: "https://fintechnews.sg/feed/"
    institutions: ["DBS", "OCBC", "UOB", "Standard Chartered", "MAS"]
    enabled: true

  - name: "The Asian Banker"
    tier: 2
    type: "rss"
    url: "https://theasianbanker.com/feed"
    institutions: ["DBS", "OCBC", "UOB", "Standard Chartered"]
    enabled: true

  - name: "PYMNTS"
    tier: 2
    type: "rss"
    url: "https://www.pymnts.com/feed/"
    institutions: ["Visa", "Mastercard", "American Express", "SWIFT", "TCH"]
    enabled: true

  - name: "Payments Dive"
    tier: 2
    type: "rss"
    url: "https://www.paymentsdive.com/feeds/news/"
    institutions: ["SWIFT", "TCH", "Visa", "Mastercard"]
    enabled: true

  - name: "The Paypers"
    tier: 2
    type: "rss"
    url: "https://www.thepaypers.com/rss/news.xml"
    institutions: ["SWIFT", "Visa", "Mastercard", "American Express", "TCH"]
    enabled: true

  - name: "Economic Times Banking"
    tier: 2
    type: "rss"
