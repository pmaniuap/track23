    institutions: ["HDFC Bank", "State Bank of India", "IDFC FIRST Bank", "Axis Bank", "AU Small Finance Bank", "NPCI", "UPI", "Bharat Bill Payment System"]
    enabled: true

  - name: "Moneycontrol Business"
    tier: 2
    type: "rss"
    url: "https://www.moneycontrol.com/rss/business.xml"
    institutions: ["HDFC Bank", "State Bank of India", "IDFC FIRST Bank", "Axis Bank", "AU Small Finance Bank", "NPCI", "UPI", "Bharat Bill Payment System", "IFSCA"]
    enabled: true

  # --- Tier 3: Challengers (Neobanks) & Aggregators ---
  - name: "Revolut Blog"
    tier: 3
    type: "rss"
    url: "https://blog.revolut.com/rss"
    institutions: ["Revolut"]
    enabled: true

  - name: "Sifted"
    tier: 3
    type: "rss"
    url: "https://sifted.eu/feed"
    institutions: ["Revolut", "Monzo", "Nubank", "Starling Bank"]
    enabled: true

  - name: "TechCrunch Fintech"
    tier: 3
    type: "rss"
    url: "https://techcrunch.com/category/fintech/feed/"
    institutions: ["Revolut", "Monzo", "Nubank", "Starling Bank"]
    enabled: true

  - name: "AltFi"
    tier: 3
    type: "rss"
    url: "https://www.altfi.com/feed"
    institutions: ["Revolut", "Monzo", "Nubank", "Starling Bank"]
    enabled: true

  - name: "Inc42"
    tier: 3
    type: "rss"
    url: "https://inc42.com/feed/"
    institutions: ["PhonePe", "Razorpay", "Paytm", "CRED"]
    enabled: true

  - name: "NewsAPI - Global Challengers"
    tier: 3
    type: "newsapi"
    query: '"{institution}" AND (launch OR partnership OR acquisition OR regulation OR product)'
    institutions: ["Revolut", "Monzo", "Nubank", "Starling Bank"]
    daily_request_budget: 80
    enabled: true

  - name: "NewsAPI - Indian Fintechs"
    tier: 3
    type: "newsapi"
    query: '"{institution}" AND (launch OR partnership OR acquisition OR regulation OR product)'
    institutions: ["PhonePe", "Razorpay", "Paytm", "CRED", "IFSCA"]
    daily_request_budget: 80
    enabled: true
